    <div id="landingOverlay" class="landing-overlay" hidden aria-hidden="true" role="dialog" aria-labelledby="landingTitle">
        <!-- [v6.6.319] 신규 방문자이면 DOM 파싱 시점에 즉시 hidden 해제 → LCP 대기 시간 단축.
             landing.js 는 body 끝 17번째 스크립트라 이걸 기다리지 않고 먼저 페인팅시킨다. -->
        <script>
            if (window.__imtNewVisitor) {
                var _ov = document.getElementById('landingOverlay');
                if (_ov) {
                    _ov.hidden = false;
                    _ov.setAttribute('aria-hidden', 'false');
                    document.body && document.body.classList.add('landing-active');
                }
            }
        </script>
        <button type="button" class="landing-close" id="landingCloseBtn" title="닫기" aria-label="닫기" hidden><i class="fas fa-times"></i></button>
        <div class="landing-inner">
            <header class="landing-header">
                <div class="landing-brand">IME</div>
                <h1 id="landingTitle" class="landing-title">모니터링할 게임을 선택하세요</h1>
                <p class="landing-subtitle">선택한 게임만 커뮤니티/댓글 탭에 표시됩니다. 나중에 좌측 상단 <b>IME</b> 로고를 클릭해 다시 열 수 있습니다.</p>
            </header>

            <section class="landing-section">
                <div class="landing-section-head">
                    <h2 class="landing-section-title">운영 게임</h2>
                    <div class="landing-section-actions">
                        <button type="button" class="landing-chip" id="landingSelectAllBtn">전부 선택</button>
                        <button type="button" class="landing-chip" id="landingClearAllBtn">전부 해제</button>
                    </div>
                </div>
                <div class="landing-game-grid" id="landingGameGrid">
                    <div class="landing-empty">게임 목록 로딩 중...</div>
                </div>
            </section>

            <section class="landing-section">
                <div class="landing-section-head">
                    <h2 class="landing-section-title">테마</h2>
                </div>
                <div class="landing-theme-row" id="landingThemeRow">
                    <button type="button" class="landing-theme" data-theme="dark"><span class="landing-theme-swatch" style="background:#94A3B8"></span><span>Steel Monitor Dark</span></button>
                    <button type="button" class="landing-theme" data-theme="monitor"><span class="landing-theme-swatch" style="background:#64748B"></span><span>Steel Monitor</span></button>
                    <button type="button" class="landing-theme" data-theme="blue"><span class="landing-theme-swatch" style="background:#3B82F6"></span><span>Cobalt Blue</span></button>
                    <button type="button" class="landing-theme" data-theme="amber"><span class="landing-theme-swatch" style="background:#FBBF24"></span><span>Amber Terminal</span></button>
                    <button type="button" class="landing-theme" data-theme="emerald"><span class="landing-theme-swatch" style="background:#10B981"></span><span>Emerald Focus</span></button>
                </div>
            </section>

            <footer class="landing-footer">
                <span class="landing-selected-count" id="landingSelectedCount">0개 선택</span>
                <button type="button" class="landing-primary" id="landingStartBtn"><i class="fas fa-play"></i> 모니터링 시작</button>
            </footer>
        </div>
    </div>
